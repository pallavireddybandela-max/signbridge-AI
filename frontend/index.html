<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-4a1 1 0 0 1-2 0V7a1 1 0 0 1 2 0z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignBridge AI — Two-Way Indian Sign Language Communication Bridge</title>
    <meta name="description" content="AI-powered two-way communication bridge for Indian Sign Language. Real-time vision recognition, context & intent understanding, 3D avatar animations, and speech synthesis." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS with custom futuristic theme configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                950: '#030712',
                900: '#0d1322',
                850: '#131b2e',
                800: '#1e293b',
                700: '#334155'
              },
              cyan: {
                300: '#67e8f9',
                400: '#22d3ee',
                500: '#06b6d4'
              },
              indigo: {
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5'
              },
              emerald: {
                400: '#34d399',
                500: '#10b981'
              },
              rose: {
                400: '#fb7185',
                500: '#f43f5e',
                600: '#e11d48'
              }
            },
            fontFamily: {
              display: ['Outfit', 'sans-serif'],
              mono: ['Space Grotesk', 'monospace'],
              body: ['Inter', 'sans-serif']
            },
            boxShadow: {
              neon: '0 0 25px rgba(99, 102, 241, 0.35)',
              alert: '0 0 35px rgba(244, 63, 94, 0.45)',
              cyan: '0 0 25px rgba(6, 182, 212, 0.35)'
            }
          }
        }
      }
    </script>

    <!-- MediaPipe Hands & Camera Utils for Client-Side Vision (Graceful optional load) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous" defer></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
